<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>우리반타이머</title>
<style>
  :root{
    --bg:#111418; --surface:#1a1e24; --line:#2a3038; --text:#f1f3f5; --muted:#7d8792;
    --accent:#4c9aff; --warn:#f5a524; --danger:#f0524f;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--text);
       font-family:"Pretendard","Malgun Gothic","맑은 고딕","Apple SD Gothic Neo",sans-serif;
       display:flex;flex-direction:column;overflow:hidden;user-select:none;-webkit-tap-highlight-color:transparent}
  button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
  .num{font-family:"Consolas","SF Mono","Roboto Mono",monospace;font-variant-numeric:tabular-nums;font-weight:600;letter-spacing:-.03em}

  /* 상단 탭 */
  header{display:flex;justify-content:center;align-items:center;padding:clamp(.6rem,2vh,1.2rem) 1rem 0;position:relative}
  .seg{display:flex;background:var(--surface);border-radius:999px;padding:4px;gap:2px}
  .seg button{font-size:clamp(.95rem,1.6vw,1.35rem);font-weight:600;color:var(--muted);
              padding:.55em 1.4em;border-radius:999px;white-space:nowrap;transition:.15s}
  .seg button.on{background:var(--text);color:var(--bg)}
  .fs{position:absolute;right:1rem;top:50%;transform:translateY(-25%);width:2.6rem;height:2.6rem;border-radius:50%;
      color:var(--muted);font-size:1.2rem}
  .fs:hover{background:var(--surface);color:var(--text)}

  main{flex:1;position:relative}
  section{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;
          padding:2vh 1.5rem;gap:clamp(.8rem,3vh,2.2rem)}
  section.on{display:flex}

  .big{font-size:clamp(3.5rem,min(20vw,34vh),28rem);line-height:.95}
  .small{font-size:.32em;color:var(--muted);font-weight:500}
  .caption{font-size:clamp(1rem,min(2.4vw,3.6vh),2rem);color:var(--muted);font-weight:500}

  /* 버튼 */
  .row{display:flex;gap:clamp(.4rem,1vw,.8rem);justify-content:center;align-items:center;flex-wrap:wrap}
  .btn{font-size:clamp(1.1rem,min(2.6vw,4.2vh),2.2rem);font-weight:700;padding:.6em 0;width:clamp(7rem,14vw,13rem);
       border-radius:999px;background:var(--surface);color:var(--text);transition:.12s}
  .btn.primary{background:var(--accent);color:#fff}
  .btn.pause{background:var(--text);color:var(--bg)}
  .btn:active,.ghost:active{transform:scale(.97)}
  .ghost{font-size:clamp(.95rem,min(1.9vw,3vh),1.6rem);font-weight:600;padding:.5em 1em;border-radius:999px;
         border:1.5px solid var(--line);color:var(--text);min-width:4.2em;transition:.12s}
  .ghost:hover{border-color:var(--muted)}
  .ghost.on{border-color:var(--accent);color:var(--accent)}

  /* 시계 */
  .world{display:grid;grid-template-columns:repeat(4,1fr);width:min(100%,1500px);border-top:1px solid var(--line)}
  .city{padding:clamp(.5rem,1.6vh,1.1rem) .5rem;text-align:center;border-bottom:1px solid var(--line)}
  .city .n{font-size:clamp(.9rem,min(1.6vw,2.6vh),1.4rem);color:var(--muted);font-weight:600}
  .city .t{font-size:clamp(1.8rem,min(4.4vw,7vh),4.6rem);line-height:1.15}
  .city .d{font-size:clamp(.8rem,min(1.3vw,2.2vh),1.15rem);color:var(--muted)}

  /* 타이머 */
  #tmDisp{transition:color .3s}
  #tmDisp.warn{color:var(--warn)} #tmDisp.last{color:var(--danger)}
  .bar{width:min(90%,1300px);height:6px;background:var(--surface);border-radius:99px;overflow:hidden;flex:0 0 auto}
  .bar>div{height:100%;width:100%;background:var(--accent);transition:width .25s linear,background .3s}
  .group{display:flex;flex-direction:column;align-items:center;gap:clamp(.5rem,1.5vh,1rem)}

  /* 스톱워치 */
  .laps{width:min(100%,700px);max-height:24vh;overflow:auto;border-top:1px solid var(--line)}
  .lap{display:flex;justify-content:space-between;padding:.45rem .3rem;border-bottom:1px solid var(--line);
       font-size:clamp(1rem,min(2vw,3vh),1.6rem)}
  .lap span:first-child{color:var(--muted)}

  /* 알람 */
  .picker{display:flex;align-items:center;gap:clamp(.5rem,2vw,1.5rem)}
  .spin{display:flex;flex-direction:column;align-items:center;gap:.4rem}
  .spin .ghost{min-width:3em;padding:.3em 0}
  .mid{font-size:clamp(3rem,min(11vw,16vh),10rem);line-height:1}
  input.memo{font-size:clamp(1rem,min(2vw,3vh),1.5rem);padding:.6em 1em;border-radius:999px;border:1.5px solid var(--line);
             background:transparent;color:var(--text);font-family:inherit;width:min(70vw,16em);outline:none}
  input.memo:focus{border-color:var(--accent)}
  .alist{width:min(100%,900px);max-height:30vh;overflow:auto;border-top:1px solid var(--line)}
  .al{display:flex;align-items:center;gap:1rem;padding:.5rem .3rem;border-bottom:1px solid var(--line)}
  .al .t{font-size:clamp(1.6rem,min(3.6vw,5.5vh),3rem)}
  .al .m{flex:1;color:var(--muted);font-size:clamp(.95rem,min(1.8vw,2.8vh),1.4rem)}
  .al.off .t,.al.off .m{opacity:.35}
  .switch{width:3.2rem;height:1.8rem;border-radius:99px;background:var(--line);position:relative;flex:0 0 auto}
  .switch::after{content:"";position:absolute;top:3px;left:3px;width:calc(1.8rem - 6px);height:calc(1.8rem - 6px);border-radius:50%;background:#fff;transition:.15s}
  .switch.on{background:var(--accent)} .switch.on::after{left:calc(100% - 1.8rem + 3px)}
  .del{color:var(--muted);font-size:1.4rem;width:2.2rem;height:2.2rem;border-radius:50%}
  .del:hover{background:var(--surface);color:var(--text)}
  .empty{color:var(--muted);text-align:center;padding:1rem;font-size:1.1rem}

  /* 울림 */
  #ring{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:2rem;z-index:50;
        background:var(--danger);cursor:pointer;animation:pulse 1.2s ease-in-out infinite}
  #ring.on{display:flex}
  #ring .msg{font-size:clamp(3rem,min(13vw,22vh),14rem);font-weight:800;text-align:center;line-height:1.1;color:#fff}
  #ring .sub{font-size:clamp(1.1rem,3vw,2.2rem);color:#fff;opacity:.85}
  @keyframes pulse{0%,100%{background:#e2453f}50%{background:#b8302b}}

  @media (max-width:900px){ .world{grid-template-columns:repeat(2,1fr)} }
  @media (max-width:600px){
    .seg button{font-size:.95rem;padding:.55em .9em}
    .fs{display:none}
    .big{font-size:min(24vw,30vh)}
    .btn{font-size:1.25rem;width:8rem}
    .ghost{font-size:1.05rem}
  }
</style>
</head>
<body>
<header>
  <nav class="seg">
    <button class="on" data-t="clock">시계</button>
    <button data-t="stopwatch">스톱워치</button>
    <button data-t="timer">타이머</button>
    <button data-t="alarm">알람</button>
  </nav>
  <button class="fs" id="fsBtn" title="전체화면 (F11)">⛶</button>
</header>

<main>
  <!-- 시계 + 세계시각 -->
  <section id="clock" class="on">
    <div class="caption" id="cDate"></div>
    <div class="big num" id="cTime"></div>
    <div class="world" id="world"></div>
  </section>

  <!-- 스톱워치 -->
  <section id="stopwatch">
    <div class="big num" id="swDisp"></div>
    <div class="row">
      <button class="btn" id="swLap">기록</button>
      <button class="btn primary" id="swStart">시작</button>
      <button class="btn" id="swReset">초기화</button>
    </div>
    <div class="laps" id="laps" hidden></div>
  </section>

  <!-- 타이머 -->
  <section id="timer">
    <div class="big num" id="tmDisp">05:00</div>
    <div class="bar"><div id="tmBar"></div></div>
    <div class="group">
      <div class="row" id="tmAdj">
        <button class="ghost" data-add="-60">−1분</button>
        <button class="ghost" data-add="-10">−10초</button>
        <button class="ghost" data-add="10">+10초</button>
        <button class="ghost" data-add="60">+1분</button>
        <button class="ghost" data-add="300">+5분</button>
      </div>
      <div class="row" id="tmPre">
        <button class="ghost" data-set="60">1분</button>
        <button class="ghost" data-set="180">3분</button>
        <button class="ghost on" data-set="300">5분</button>
        <button class="ghost" data-set="600">10분</button>
        <button class="ghost" data-set="900">15분</button>
        <button class="ghost" data-set="1200">20분</button>
        <button class="ghost" data-set="2400">40분</button>
      </div>
    </div>
    <div class="row">
      <button class="btn primary" id="tmStart">시작</button>
      <button class="btn" id="tmReset">초기화</button>
    </div>
  </section>

  <!-- 알람 -->
  <section id="alarm">
    <div class="picker">
      <div class="spin">
        <button class="ghost" data-h="1">▲</button>
        <div class="mid num" id="aH">09</div>
        <button class="ghost" data-h="-1">▼</button>
      </div>
      <div class="mid num" style="color:var(--muted)">:</div>
      <div class="spin">
        <button class="ghost" data-m="5">▲</button>
        <div class="mid num" id="aM">00</div>
        <button class="ghost" data-m="-5">▼</button>
      </div>
    </div>
    <div class="row">
      <input class="memo" id="aMemo" placeholder="메모 (예: 쉬는 시간 끝)" maxlength="20">
      <button class="btn primary" id="aAdd">추가</button>
    </div>
    <div class="alist" id="aList"></div>
  </section>
</main>

<div id="ring">
  <div class="msg" id="ringMsg">시간 끝!</div>
  <div class="sub">화면을 누르면 멈춰요</div>
</div>

<script>
const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2, '0');

/* ---------- 탭 ---------- */
const tabs = document.querySelectorAll('.seg button');
tabs.forEach(b => b.onclick = () => {
  tabs.forEach(x => x.classList.toggle('on', x === b));
  document.querySelectorAll('main section').forEach(s => s.classList.toggle('on', s.id === b.dataset.t));
});
$('fsBtn').onclick = () => {
  if (document.fullscreenElement) document.exitFullscreen();
  else document.documentElement.requestFullscreen().catch(() => {});
};

/* ---------- 소리 ---------- */
let actx = null;
function audio() {
  if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
  if (actx.state === 'suspended') actx.resume();
  return actx;
}
document.addEventListener('pointerdown', () => audio(), { once: true });
function beep(freq = 880, dur = 0.18, when = 0, vol = 0.5) {
  const a = audio(), o = a.createOscillator(), g = a.createGain();
  o.type = 'square'; o.frequency.value = freq;
  const t = a.currentTime + when;
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + 0.01);
  g.gain.setValueAtTime(vol, t + dur - 0.03); g.gain.linearRampToValueAtTime(0, t + dur);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t + dur + 0.02);
}
let ringTimer = null;
function startRing(msg) {
  $('ringMsg').textContent = msg;
  $('ring').classList.add('on');
  const pattern = () => { beep(988,.15,0); beep(988,.15,.22); beep(988,.15,.44); beep(1319,.3,.66); };
  pattern(); clearInterval(ringTimer); ringTimer = setInterval(pattern, 1500);
}
function stopRing() { clearInterval(ringTimer); ringTimer = null; $('ring').classList.remove('on'); }
$('ring').onclick = stopRing;

/* ---------- 시계 + 세계시각 ---------- */
const CITIES = [
  ['서울','Asia/Seoul'], ['도쿄','Asia/Tokyo'], ['베이징','Asia/Shanghai'], ['뉴델리','Asia/Kolkata'],
  ['런던','Europe/London'], ['파리','Europe/Paris'], ['뉴욕','America/New_York'], ['시드니','Australia/Sydney']
];
const DAYS = ['일','월','화','수','목','금','토'];
function partsIn(tz, d) {
  const f = new Intl.DateTimeFormat('en-US', { timeZone: tz, year:'numeric', month:'numeric', day:'numeric',
    hour:'numeric', minute:'numeric', hourCycle:'h23' });
  const o = {}; f.formatToParts(d).forEach(p => o[p.type] = p.value);
  return { y:+o.year, mo:+o.month, d:+o.day, h:+o.hour % 24, m:+o.minute };
}
$('world').innerHTML = CITIES.map((c,i) =>
  `<div class="city" id="city${i}"><div class="n">${c[0]}</div><div class="t num"></div><div class="d"></div></div>`).join('');
function tickClock() {
  const now = new Date(), h = now.getHours();
  $('cDate').textContent = `${now.getMonth()+1}월 ${now.getDate()}일 ${DAYS[now.getDay()]}요일`;
  $('cTime').innerHTML = `<span class="small">${h < 12 ? '오전 ' : '오후 '}</span>${pad(h % 12 || 12)}:${pad(now.getMinutes())}<span class="small"> ${pad(now.getSeconds())}</span>`;
  const here = partsIn(Intl.DateTimeFormat().resolvedOptions().timeZone, now);
  const hereDay = Date.UTC(here.y, here.mo-1, here.d);
  CITIES.forEach((c,i) => {
    const p = partsIn(c[1], now), el = $('city'+i);
    el.querySelector('.t').textContent = `${pad(p.h)}:${pad(p.m)}`;
    const diff = Math.round((Date.UTC(p.y, p.mo-1, p.d) - hereDay) / 864e5);
    el.querySelector('.d').textContent = `${diff === 0 ? '오늘' : diff > 0 ? '내일' : '어제'} · ${p.h >= 6 && p.h < 18 ? '낮' : '밤'}`;
  });
  checkAlarms(now);
}

/* ---------- 스톱워치 ---------- */
let swRun = false, swBase = 0, swAcc = 0, laps = [];
function swNow() { return swAcc + (swRun ? performance.now() - swBase : 0); }
function fmtSW(ms) {
  const t = Math.floor(ms / 10), cs = t % 100, s = Math.floor(t / 100) % 60, m = Math.floor(t / 6000) % 60, h = Math.floor(t / 360000);
  return (h ? h + ':' + pad(m) : pad(m)) + ':' + pad(s) + `<span class="small">.${pad(cs)}</span>`;
}
function drawSW() { $('swDisp').innerHTML = fmtSW(swNow()); }
function setSwBtn() {
  $('swStart').textContent = swRun ? '멈춤' : (swNow() ? '계속' : '시작');
  $('swStart').className = 'btn ' + (swRun ? 'pause' : 'primary');
}
$('swStart').onclick = () => {
  if (swRun) { swAcc += performance.now() - swBase; swRun = false; }
  else { swBase = performance.now(); swRun = true; }
  setSwBtn();
};
$('swLap').onclick = () => { const t = swNow(); if (t) { laps.unshift(t); drawLaps(); } };
$('swReset').onclick = () => { swRun = false; swAcc = 0; laps = []; drawLaps(); drawSW(); setSwBtn(); };
function drawLaps() {
  $('laps').hidden = !laps.length;
  $('laps').innerHTML = laps.map((t,i) => `<div class="lap"><span>${laps.length - i}</span><span class="num">${fmtSW(t)}</span></div>`).join('');
}

/* ---------- 타이머 ---------- */
const MAX = 10 * 3600 - 1;
let tmSet = 300, tmLeft = 300, tmRun = false, tmEnd = 0, lastBeepSec = -1;
function tmRemaining() { return tmRun ? Math.max(0, (tmEnd - Date.now()) / 1000) : tmLeft; }
function fmtTM(sec) {
  sec = Math.ceil(sec);
  const h = Math.floor(sec / 3600), m = Math.floor(sec / 60) % 60, s = sec % 60;
  return (h ? h + ':' + pad(m) : pad(m)) + ':' + pad(s);
}
function drawTM() {
  const r = tmRemaining(), el = $('tmDisp');
  el.textContent = fmtTM(r);
  el.classList.toggle('last', r > 0 && r <= 10);
  el.classList.toggle('warn', r > 10 && r <= 60);
  $('tmBar').style.width = (tmSet ? Math.min(100, r / tmSet * 100) : 0) + '%';
  $('tmBar').style.background = r <= 10 ? 'var(--danger)' : r <= 60 ? 'var(--warn)' : 'var(--accent)';
  if (tmRun) {
    const cs = Math.ceil(r);
    if (cs <= 5 && cs > 0 && cs !== lastBeepSec) { lastBeepSec = cs; beep(660, .12, 0, .35); }
    if (r <= 0) { tmRun = false; tmLeft = 0; setTmBtn(); startRing('시간 끝!'); }
  }
}
function setTmBtn() {
  $('tmStart').textContent = tmRun ? '일시정지' : (tmLeft > 0 && tmLeft < tmSet ? '계속' : '시작');
  $('tmStart').className = 'btn ' + (tmRun ? 'pause' : 'primary');
}
function markPreset(v) { document.querySelectorAll('#tmPre .ghost').forEach(b => b.classList.toggle('on', +b.dataset.set === v)); }
$('tmStart').onclick = () => {
  audio();
  if (tmRun) { tmLeft = tmRemaining(); tmRun = false; }
  else {
    if (tmLeft <= 0) tmLeft = tmSet;
    if (tmLeft <= 0) return;
    tmEnd = Date.now() + tmLeft * 1000; tmRun = true; lastBeepSec = -1;
  }
  setTmBtn(); drawTM();
};
$('tmReset').onclick = () => { tmRun = false; tmLeft = tmSet; setTmBtn(); drawTM(); };
// 프리셋: 멈춰 있으면 시간만 바꾸고, 진행 중이면 그 시간으로 새로 시작
document.querySelectorAll('#tmPre .ghost').forEach(b => b.onclick = () => {
  const v = +b.dataset.set; tmSet = tmLeft = v; markPreset(v);
  if (tmRun) { tmEnd = Date.now() + v * 1000; lastBeepSec = -1; }
  setTmBtn(); drawTM();
});
// ± 조절: 진행 중에도 바로 반영
document.querySelectorAll('#tmAdj .ghost').forEach(b => b.onclick = () => {
  const add = +b.dataset.add;
  if (tmRun) {
    const r = Math.min(MAX, Math.max(1, tmRemaining() + add));
    tmEnd = Date.now() + r * 1000;
    tmSet = Math.max(r, Math.min(MAX, tmSet + add));
    if (r > 5) lastBeepSec = -1;
  } else {
    tmLeft = Math.min(MAX, Math.max(0, Math.round(tmLeft) + add));
    tmSet = tmLeft;
  }
  markPreset(tmSet); setTmBtn(); drawTM();
});

/* ---------- 알람 ---------- */
let aH = 9, aM = 0, alarms = [];
try { alarms = JSON.parse(localStorage.getItem('classAlarms') || '[]'); } catch (e) { alarms = []; }
function saveAlarms() { try { localStorage.setItem('classAlarms', JSON.stringify(alarms)); } catch (e) {} }
function drawSet() { $('aH').textContent = pad(aH); $('aM').textContent = pad(aM); }
document.querySelectorAll('[data-h]').forEach(b => b.onclick = () => { aH = (aH + +b.dataset.h + 24) % 24; drawSet(); });
document.querySelectorAll('[data-m]').forEach(b => b.onclick = () => { aM = (aM + +b.dataset.m + 60) % 60; drawSet(); });
$('aM').onclick = () => { aM = (aM + 1) % 60; drawSet(); };   // 숫자를 누르면 1분씩
$('aH').onclick = () => { aH = (aH + 1) % 24; drawSet(); };
$('aAdd').onclick = () => {
  alarms.push({ id: Date.now(), h: aH, m: aM, memo: $('aMemo').value.trim(), on: true, last: '' });
  alarms.sort((a,b) => (a.h*60+a.m) - (b.h*60+b.m));
  $('aMemo').value = ''; saveAlarms(); drawAlarms(); audio();
};
const esc = s => s.replace(/[<>&"]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));
function drawAlarms() {
  $('aList').innerHTML = alarms.length ? alarms.map(a => `
    <div class="al ${a.on ? '' : 'off'}">
      <span class="t num">${a.h < 12 ? '오전' : '오후'} ${pad(a.h % 12 || 12)}:${pad(a.m)}</span>
      <span class="m">${esc(a.memo || '')}</span>
      <button class="switch ${a.on ? 'on' : ''}" data-tog="${a.id}" aria-label="켜기/끄기"></button>
      <button class="del" data-del="${a.id}" aria-label="삭제">×</button>
    </div>`).join('') : '<div class="empty">알람이 없어요</div>';
  $('aList').querySelectorAll('[data-tog]').forEach(b => b.onclick = () => {
    const a = alarms.find(x => x.id == b.dataset.tog); a.on = !a.on; saveAlarms(); drawAlarms(); });
  $('aList').querySelectorAll('[data-del]').forEach(b => b.onclick = () => {
    alarms = alarms.filter(x => x.id != b.dataset.del); saveAlarms(); drawAlarms(); });
}
function checkAlarms(now) {
  const key = `${now.toDateString()} ${now.getHours()}:${now.getMinutes()}`;
  alarms.forEach(a => {
    if (a.on && a.h === now.getHours() && a.m === now.getMinutes() && a.last !== key) {
      a.last = key; saveAlarms();
      startRing(a.memo || `${pad(a.h)}:${pad(a.m)} 알람`);
    }
  });
}

/* ---------- 키보드 ---------- */
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if ($('ring').classList.contains('on')) { stopRing(); e.preventDefault(); return; }
  const cur = document.querySelector('main section.on').id;
  if (e.code === 'Space') {
    e.preventDefault();
    if (cur === 'stopwatch') $('swStart').click();
    if (cur === 'timer') $('tmStart').click();
  }
  if (e.key === 'r' || e.key === 'R') {
    if (cur === 'stopwatch') $('swReset').click();
    if (cur === 'timer') $('tmReset').click();
  }
  if ((e.key === 'l' || e.key === 'L') && cur === 'stopwatch') $('swLap').click();
  if (cur === 'timer' && (e.key === 'ArrowUp' || e.key === 'ArrowDown')) {
    e.preventDefault(); document.querySelector(`#tmAdj [data-add="${e.key === 'ArrowUp' ? 60 : -60}"]`).click();
  }
  const n = ['1','2','3','4'].indexOf(e.key);
  if (n >= 0) tabs[n].click();
});

/* ---------- 루프 ---------- */
drawSet(); drawAlarms(); drawTM(); drawSW(); tickClock();
setInterval(tickClock, 250);
(function loop() { if (swRun) drawSW(); if (tmRun) drawTM(); requestAnimationFrame(loop); })();
setInterval(() => { if (tmRun) drawTM(); }, 250);
</script>
</body>
